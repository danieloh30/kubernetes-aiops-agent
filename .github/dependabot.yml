version: 2
updates:
  # Maven dependencies
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
    open-pull-requests-limit: 10
    groups:
      quarkus:
        patterns:
          - "io.quarkus*"
          - "io.quarkus.platform*"
          - "io.quarkiverse*"
        update-types:
          - "major"
          - "minor"
          - "patch"
      langchain4j:
        patterns:
          - "dev.langchain4j*"
        update-types:
          - "major"
          - "minor"
          - "patch"
      a2a:
        patterns:
          - "io.github.a2asdk*"
        update-types:
          - "major"
          - "minor"
          - "patch"
      kubernetes:
        patterns:
          - "io.fabric8*"
        update-types:
          - "major"
          - "minor"
          - "patch"
      maven-plugins:
        patterns:
          - "*maven-plugin"
        update-types:
          - "minor"
          - "patch"
      testing:
        patterns:
          - "org.junit*"
          - "org.mockito*"
          - "org.assertj*"
          - "org.awaitility*"
          - "io.rest-assured*"
          - "com.github.tomakehurst*"
        update-types:
          - "minor"
          - "patch"
      other:
        patterns:
          - "org.eclipse.jgit*"
        update-types:
          - "minor"
          - "patch"
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
